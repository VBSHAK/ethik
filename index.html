<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Das Gewissens-Duell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<style>
:root{
  --paper:#F6F1E7; --paper2:#EDE4D3; --card:#FFFDF8;
  --ink:#17172B; --ink2:#46455C; --ink3:#7C798E; --line:#DCD1BD;
  --herz:#E0482F; --herz2:#B8321C; --herzs:#FBE0D8;
  --kopf:#2752C7; --kopf2:#1B3C99; --kopfs:#DCE5FA;
  --gold:#C4952B; --golds:#F5E7C3; --ok:#2E8B57; --bad:#C0392B;
  --a:#8B3FD9; --b:#0A8FB0; --c:#D9820B; --d:#1E9A4B;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  background-image:radial-gradient(1000px 600px at 0% -10%, rgba(224,72,47,.10), transparent 60%),
    radial-gradient(1000px 600px at 100% 110%, rgba(39,82,199,.10), transparent 60%);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:5px;z-index:100;pointer-events:none;
  background:linear-gradient(90deg,var(--herz) 0 50%,var(--kopf) 50% 100%)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none;font-size:inherit}
input{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.serif{font-family:"Fraunces",Georgia,serif;font-weight:800;letter-spacing:-.02em}
.eyebrow{font-family:"JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:block;font-size:clamp(12px,.95vw,17px);font-weight:700}
#root{height:100%;display:flex;flex-direction:column;overflow:auto}

/* ====================== Figuren ====================== */
.fig{display:block;width:100%;height:100%;overflow:visible}
.fig .up,.fig .a1,.fig .a2,.fig .hd{transform-box:fill-box}
.fig .up{transform-origin:50% 100%;animation:idUp 3.6s ease-in-out infinite}
.fig .hd{transform-origin:50% 100%;animation:idHd 3.6s ease-in-out infinite}
.fig .a1{transform-origin:50% 8px;animation:idA1 3.6s ease-in-out infinite}
.fig .a2{transform-origin:50% 8px;animation:idA2 3.6s ease-in-out infinite}
.fig .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-in-out infinite}
@keyframes halo{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes idUp{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes idHd{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
@keyframes idA1{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-4deg)}}
@keyframes idA2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
/* Tanz 1 — Wippen */
.fig.dn1{animation:d0hop .5s ease-in-out infinite}
.fig.dn1 .up{animation:d0up .5s ease-in-out infinite}
.fig.dn1 .hd{animation:d0hd .5s ease-in-out infinite}
.fig.dn1 .a1{animation:d0a1 .5s ease-in-out infinite}
.fig.dn1 .a2{animation:d0a2 .5s ease-in-out infinite}
@keyframes d0hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes d0up{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes d0hd{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
@keyframes d0a1{0%,100%{transform:rotate(20deg)}50%{transform:rotate(130deg)}}
@keyframes d0a2{0%,100%{transform:rotate(-130deg)}50%{transform:rotate(-20deg)}}
/* Tanz 2 — Arme hoch */
.fig.dn2 .up{animation:d1up .8s ease-in-out infinite}
.fig.dn2 .hd{animation:d1hd .8s ease-in-out infinite}
.fig.dn2 .a1{animation:d1a1 .8s ease-in-out infinite}
.fig.dn2 .a2{animation:d1a2 .8s ease-in-out infinite}
@keyframes d1up{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes d1hd{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes d1a1{0%,100%{transform:rotate(150deg)}50%{transform:rotate(172deg)}}
@keyframes d1a2{0%,100%{transform:rotate(-172deg)}50%{transform:rotate(-150deg)}}
/* Tanz 3 — Sirtaki (Arme seitlich, Schritt) */
.fig.dn3{animation:d2step .7s ease-in-out infinite}
.fig.dn3 .up{animation:d2up .7s ease-in-out infinite}
.fig.dn3 .a1{animation:d2a1 .7s ease-in-out infinite}
.fig.dn3 .a2{animation:d2a2 .7s ease-in-out infinite}
@keyframes d2step{0%,100%{transform:translateX(-5%)}50%{transform:translateX(5%)}}
@keyframes d2up{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes d2a1{0%,100%{transform:rotate(95deg)}50%{transform:rotate(80deg)}}
@keyframes d2a2{0%,100%{transform:rotate(-80deg)}50%{transform:rotate(-95deg)}}
/* Tanz 4 — Jubeln */
.fig.dn4{animation:d3jump .66s cubic-bezier(.3,.1,.4,1) infinite}
.fig.dn4 .a1{animation:d3a1 .33s ease-in-out infinite}
.fig.dn4 .a2{animation:d3a2 .33s ease-in-out infinite}
@keyframes d3jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-13%)}}
@keyframes d3a1{0%{transform:rotate(60deg)}100%{transform:rotate(165deg)}}
@keyframes d3a2{0%{transform:rotate(-165deg)}100%{transform:rotate(-60deg)}}
/* Tanz 5 — Denker (Hand am Kinn, wiegt den Kopf) */
.fig.dn5 .a2{animation:d4a2 1.6s ease-in-out infinite}
.fig.dn5 .hd{animation:d4hd 1.6s ease-in-out infinite}
.fig.dn5 .up{animation:d4up 1.6s ease-in-out infinite}
@keyframes d4a2{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-142deg)}}
@keyframes d4hd{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(5deg)}}
@keyframes d4up{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.fig.cheer .a1{animation:chA1 1.2s ease-in-out infinite}
.fig.cheer .a2{animation:chA2 1.2s ease-in-out infinite}
@keyframes chA1{0%,100%{transform:rotate(150deg)}50%{transform:rotate(168deg)}}
@keyframes chA2{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-168deg)}}

/* ====================== Akademie (Saal) ====================== */
.hall{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);
  background:#EFE6D4}
.hall.dusk{background:#2A2340}
.hall .wall{position:absolute;inset:0}
.hall .wall svg{display:block;width:100%;height:100%}
.hrow{position:absolute;inset:0}
.stepx{position:absolute;left:-4%;right:-4%;border-radius:4px;
  background:linear-gradient(180deg,#FBF7EE 0%,#E8DFCC 55%,#D5C9B0 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.8), 0 6px 14px rgba(40,30,10,.14)}
.figw{position:absolute;aspect-ratio:120/220;transform:translate(-50%,-100%);
  animation:walkin .55s cubic-bezier(.2,.85,.3,1) both}
@keyframes walkin{from{opacity:0;transform:translate(-50%,-100%) translateY(-30px) scale(.9)}
  to{opacity:1;transform:translate(-50%,-100%)}}
.figw .nm{position:absolute;bottom:101%;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--card);border:2px solid var(--tc,var(--ink));border-radius:99px;padding:1px 10px;font-weight:800;color:var(--ink);
  box-shadow:0 3px 8px rgba(18,22,24,.16);max-width:200%;overflow:hidden;text-overflow:ellipsis}
.figw.t0{--tc:var(--herz)} .figw.t1{--tc:var(--kopf)}
.figw.alt .nm{transform:translateX(-50%) translateY(-118%)}
.figw .tt{position:absolute;bottom:101%;left:50%;transform:translateX(-50%) translateY(-135%);
  white-space:nowrap;background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 9px;font-weight:700;font-size:.86em}
.figw.alt .tt{transform:translateX(-50%) translateY(-253%)}
.figw .rk{position:absolute;top:-4%;left:-10%;background:var(--ink);color:#fff;font-family:"JetBrains Mono",monospace;
  font-weight:700;border-radius:99px;min-width:1.9em;text-align:center;padding:0 4px;z-index:3}
.figw.gold1 .rk{background:var(--gold);color:#3A2E12}
.figw .glow{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:200%;height:200%;border-radius:50%;
  pointer-events:none;background:radial-gradient(circle,rgba(255,214,110,.55) 0%,rgba(255,214,110,0) 62%)}

/* ====================== Allgemein (Handy) ====================== */
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 18px;padding-block:16px 26px;flex:1;display:flex;flex-direction:column}
.crestbar{display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1.5px solid var(--line)}
.crest{width:30px;height:30px;flex:none}
.crestbar b{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crestbar .sc{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.crestbar .scl{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.tbadge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-weight:800;font-size:13px;color:#fff;flex:none}
.tbadge.t0{background:var(--herz)} .tbadge.t1{background:var(--kopf)}
.btn{display:block;width:100%;padding:18px 22px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:800;font-size:19px;text-align:center}
.btn.go{background:linear-gradient(90deg,var(--herz),var(--kopf));color:#fff;box-shadow:0 5px 0 #3B2A5E}
.btn.go:active{transform:translateY(3px);box-shadow:0 2px 0 #3B2A5E}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.field{width:100%;font-size:21px;padding:15px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.field:focus{border-color:var(--ink);outline:none}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 6px 18px rgba(23,23,43,.07)}
.card.gold{border:0;border-left:5px solid var(--gold);border-radius:4px 14px 14px 4px}
.p{font-size:16.5px;color:var(--ink2);margin:0;line-height:1.45}

/* Startseite */
.land{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:460px;margin:0 auto;padding:24px 18px;width:100%}
.land h1{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:clamp(40px,11vw,60px);line-height:.95;letter-spacing:-.03em}
.codein{font-family:"JetBrains Mono",monospace;font-size:34px;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:16px 10px}
.landfigs{display:flex;justify-content:center;gap:4px;height:120px}
.landfigs span{height:100%;aspect-ratio:120/220}

/* Figurenwahl */
.teampick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tp{border-radius:16px;padding:14px 12px;border:3px solid transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-weight:800;font-size:19px;line-height:1.1;opacity:.55;transition:transform .12s,opacity .2s}
.tp small{font-weight:500;font-size:12.5px;opacity:.9}
.tp .ti{font-size:34px;line-height:1}
.tp.t0{background:linear-gradient(150deg,var(--herz),var(--herz2))}.tp.t1{background:linear-gradient(150deg,var(--kopf),var(--kopf2))}
.tp.on{opacity:1;transform:translateY(-2px);border-color:var(--ink);box-shadow:0 6px 0 var(--ink)}
.archs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.arch{border-radius:12px;background:var(--card);border:1.5px solid var(--line);border-top:4px solid var(--rc,var(--line));padding:6px 3px 5px;
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.arch .af{width:100%;aspect-ratio:120/200;pointer-events:none}
.arch span{font-size:9px;font-family:"JetBrains Mono",monospace;color:var(--ink2);text-transform:uppercase;line-height:1.12;text-align:center;
  font-weight:700;overflow-wrap:anywhere;padding:0 2px}
.arch.on{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 18px rgba(18,22,24,.18);border-color:var(--rc)}
.arch.on::after{content:"";position:absolute;right:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--rc);box-shadow:0 0 0 2px #fff}
.orow{display:flex;flex-direction:column;gap:7px}
.orow > b{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:7px;color:var(--ink2)}
.opt i{width:15px;height:15px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.opt.on{border-color:var(--ink);color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(23,23,43,.1)}
.pvbar{position:sticky;bottom:0;z-index:20;margin:14px -18px -26px;padding:12px 18px 18px;
  background:linear-gradient(180deg,rgba(246,241,231,0) 0%,var(--paper) 26%);display:flex;align-items:flex-end;gap:14px}
.pvbar .pv{height:108px;aspect-ratio:120/220;flex:none;filter:drop-shadow(0 6px 12px rgba(18,22,24,.16))}
.pvbar .pi{flex:1;min-width:0}
.pvbar .pi b{display:block;font-size:16px;line-height:1.15}
.pvbar .pi i{display:block;font-style:normal;font-size:13px;color:var(--ink3);margin-top:2px}
.pvbar .gob{flex:none;background:var(--ink);color:#fff;font-weight:800;border-radius:99px;padding:15px 22px;font-size:16px;box-shadow:0 4px 0 #000}
.pvbar .gob:active{transform:translateY(2px);box-shadow:0 2px 0 #000}

/* Antwortpad */
.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad.golden{padding:8px;border-radius:18px;background:linear-gradient(135deg,#F6E7BE,#E3C786);box-shadow:0 0 0 3px var(--gold)}
.ans{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:130px;border-radius:16px;background:var(--ac);color:#fff;font-weight:800;padding:12px 10px;
  background-image:linear-gradient(160deg,rgba(255,255,255,.22),rgba(0,0,0,.14));
  box-shadow:0 6px 0 rgba(0,0,0,.24), 0 10px 22px rgba(18,22,24,.2);text-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .08s,opacity .3s}
.ans:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.ans svg{width:42px;height:42px}
.ans .lt{font-size:15px;line-height:1.2;text-align:center;font-weight:700}
.ans.gone{opacity:.12;pointer-events:none}
.pad.gv{grid-template-columns:1fr}
.pad.gv .ans{min-height:150px;flex-direction:row;gap:16px;font-size:30px}
.pad.gv .ans .big{font-family:"Fraunces",serif;font-size:40px}
.pad.gv .ans small{display:block;font-size:14px;font-weight:600;opacity:.9;font-family:"Bricolage Grotesque",sans-serif}
.jokers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jk{border-radius:12px;padding:10px 8px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;
  gap:2px;font-weight:800;font-size:15px;line-height:1.15}
.jk span{font-size:10.5px;font-family:"JetBrains Mono",monospace;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.jk.gold{border-color:var(--gold)}
.jk.gold.on{background:linear-gradient(180deg,#F5E4B8,#DFC282)}
.jk.half.on{background:var(--kopfs);border-color:var(--kopf)}
.jk:disabled{opacity:.32}
.goldnote{text-align:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8B6914;margin:0}
.tline{display:flex;align-items:center;gap:13px}
.tnum{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:32px;font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:right}
.tnum.hot{color:var(--herz)}
.ttrack{flex:1;height:12px;background:var(--paper2);border-radius:6px;overflow:hidden}
.ttrack i{display:block;height:100%;background:linear-gradient(90deg,var(--herz),var(--kopf));border-radius:6px;transition:width .3s linear}
.verdict{border-radius:16px;padding:24px 20px;text-align:center;color:#fff}
.verdict.good{background:var(--ok)} .verdict.bad{background:var(--bad)} .verdict.miss{background:var(--ink3)}
.verdict.gold2{background:linear-gradient(135deg,#B08A2E,#8A6A1F)} .verdict.poll{background:linear-gradient(135deg,var(--herz),var(--kopf))}
.verdict .vt{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:42px;line-height:1}
.verdict .vp{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:20px;margin-top:8px}
.bigq{font-family:"Fraunces",serif;font-weight:700;font-size:21px;line-height:1.25;text-align:center}

/* Reaktionen */
.react{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:9px}
.emobar{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.emo{width:42px;height:42px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);font-size:23px;display:flex;align-items:center;justify-content:center}
.emo:active{transform:scale(.84)}
.shouts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.sh{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.sh:active{transform:scale(.95)}
.dancerow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dc{border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;font-size:11.5px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.dc b{font-size:18px;font-weight:400}
.dc:active{transform:translateY(1px)}
.lookbtn{border:1.5px dashed var(--line);background:transparent;border-radius:99px;padding:9px;font-size:13px;font-weight:700;color:var(--ink3);width:100%}
.emobar,.shouts,.dancerow{transition:opacity .22s}
body.cooling .emobar,body.cooling .shouts,body.cooling .dancerow{opacity:.38;pointer-events:none}
body.cooling .react::after{content:"Kurz durchatmen";display:block;text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.flame{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(180deg,#F4D98B,#DDBB63);color:#5B4413;border-radius:99px;
  padding:1px 7px;font-weight:700;font-size:.72em;font-family:"JetBrains Mono",monospace}
.seriebig{display:inline-flex;align-items:center;gap:8px;border-radius:99px;background:linear-gradient(180deg,#F6E4B4,#E3C782);color:#5B4413;
  font-weight:800;padding:8px 18px;font-size:16px}
.minihall{height:200px;border-radius:14px;overflow:hidden;position:relative;display:flex}

/* ====================== Tauziehen ====================== */
.tug{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(8px,1vw,18px)}
.tug .ts{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(14px,1.2vw,22px);line-height:1.05}
.tug .ts b{font-family:"JetBrains Mono",monospace;font-size:1.15em}
.tug .ts small{display:block;font-size:.62em;font-weight:600;color:var(--ink3);font-family:"JetBrains Mono",monospace}
.tug .ts.t0{color:var(--herz)} .tug .ts.t1{color:var(--kopf);text-align:right;flex-direction:row-reverse}
.tug .ti{width:clamp(30px,2.6vw,48px);height:clamp(30px,2.6vw,48px);border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:clamp(16px,1.4vw,26px);flex:none}
.tug .t0 .ti{background:var(--herz)} .tug .t1 .ti{background:var(--kopf)}
.rope{position:relative;height:clamp(30px,3vw,54px)}
.rope .ln{position:absolute;left:0;right:0;top:50%;height:clamp(8px,.8vw,14px);transform:translateY(-50%);border-radius:7px;
  background:repeating-linear-gradient(115deg,#B89260 0 10px,#9C7646 10px 20px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.rope .mid{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink);opacity:.25;border-radius:2px}
.rope .knot{position:absolute;top:50%;left:var(--p,50%);width:clamp(22px,2.2vw,40px);height:clamp(22px,2.2vw,40px);transform:translate(-50%,-50%);
  border-radius:50%;background:var(--gold);border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:left 1.1s cubic-bezier(.2,1.3,.4,1)}
.tug.big .rope{height:clamp(44px,4.4vw,80px)}
.tug.big .ts{font-size:clamp(18px,1.8vw,34px)}
.tug.big .ti{width:clamp(44px,4vw,74px);height:clamp(44px,4vw,74px);font-size:clamp(22px,2.2vw,40px)}

/* ====================== Beamer ====================== */
.adm{flex:1;display:flex;min-height:0;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;padding:clamp(18px,2.4vw,40px) clamp(20px,2.6vw,44px)}
.rail{flex:0 0 clamp(250px,21vw,350px);background:var(--card);border-left:1.5px solid var(--line);display:flex;flex-direction:column;
  min-height:0;padding:clamp(14px,1.5vw,24px);gap:12px}
.rail h3{font-family:"JetBrains Mono",monospace;font-size:clamp(12px,.95vw,15px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
  padding-bottom:10px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:8px}
.rail h3 b{margin-left:auto;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:1.1em}
.railteam{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--paper)}
.railteam .tug .ts{font-size:clamp(12px,.9vw,16px)}
.lb{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.lb li{display:grid;grid-template-columns:2ch 10px 1fr auto auto;gap:9px;align-items:center;padding:clamp(6px,.7vw,10px) 4px;
  border-bottom:1px solid var(--paper2);font-size:clamp(14px,1.1vw,19px);transition:background .5s}
.lb li.bump{background:var(--golds)}
.lb .r{font-family:"JetBrains Mono",monospace;color:var(--ink3);font-size:.85em;text-align:right}
.lb .d{width:10px;height:10px;border-radius:50%}
.lb .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .s{font-family:"JetBrains Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums}
.lb li.p1 .r{color:var(--gold);font-weight:800}
.qhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:clamp(8px,1.2vh,18px)}
.qhead .step{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ink);font-size:clamp(14px,1.2vw,21px);letter-spacing:.1em;
  background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 14px}
.qhead .kind{font-weight:800;font-size:clamp(14px,1.2vw,21px);border-radius:99px;padding:5px 14px;color:#fff}
.kind.mc{background:var(--ink)} .kind.gv{background:linear-gradient(90deg,var(--herz),var(--kopf))} .kind.poll{background:var(--gold);color:#3A2E12}
.kind.fin{background:linear-gradient(90deg,#B08A2E,#E8C766);color:#3A2E12}
.qhead .cnt{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:clamp(15px,1.3vw,23px);color:var(--ink2);font-variant-numeric:tabular-nums}
.bq{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.02em;font-size:clamp(28px,3.4vw,60px);line-height:1.05;margin:0 0 clamp(12px,1.8vh,24px)}
.btimer{display:flex;align-items:center;gap:clamp(12px,1.4vw,22px);margin-bottom:clamp(10px,1.6vh,22px)}
.btimer .bn{font-family:"JetBrains Mono",monospace;font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(36px,4.6vw,84px);line-height:.9;min-width:2.3ch;text-align:right}
.btimer .bn.hot{color:var(--herz)}
.btimer .bt{flex:1;height:clamp(10px,1.2vh,17px);background:var(--paper2);border-radius:10px;overflow:hidden}
.btimer .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--herz),var(--kopf));border-radius:10px;transition:width .3s linear}
.qtiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.2vw,20px);width:100%;flex:1;max-height:56vh;grid-auto-rows:1fr}
.qtiles .qt{font-size:clamp(20px,2.3vw,40px)!important}
.qtile{display:flex;align-items:center;gap:clamp(11px,1.3vw,19px);background:var(--qc);color:#fff;border-radius:16px;
  padding:clamp(14px,1.6vw,28px) clamp(16px,1.8vw,30px);box-shadow:0 5px 0 rgba(0,0,0,.2);position:relative;overflow:hidden;
  background-image:linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.12));text-shadow:0 2px 4px rgba(0,0,0,.22);animation:tileIn .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes tileIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.qtile svg{width:clamp(30px,2.8vw,50px);height:clamp(30px,2.8vw,50px);flex:none}
.qtile .qt{font-size:clamp(17px,1.8vw,31px);font-weight:700;line-height:1.14}
/* Herz-oder-Kopf-Frage: zwei große Hälften */
.gvstage{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:24px;overflow:hidden;min-height:0;position:relative}
.gvhalf{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;color:#fff;padding:clamp(18px,3vh,40px) 20px 20px}
.gvhalf.h{background:linear-gradient(150deg,var(--herz),var(--herz2))} .gvhalf.k{background:linear-gradient(150deg,var(--kopf),var(--kopf2))}
.gvhalf .gi{font-size:clamp(60px,7vw,130px);line-height:1}
.gvhalf .gl{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(34px,4vw,72px);line-height:1}
.gvhalf .gs{font-family:"JetBrains Mono",monospace;font-size:clamp(13px,1.1vw,19px);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.gvhalf .gc{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:clamp(26px,3vw,54px)}
.gvhalf.dim{filter:saturate(.25) brightness(.8)}
.gvcase{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);width:min(64%,900px);background:var(--card);color:var(--ink);
  border-radius:22px;padding:clamp(18px,2vw,34px);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;border:4px solid var(--ink)}
.gvcase .bq{margin:0;font-size:clamp(24px,2.6vw,46px)}
.gvcase .eyebrow{margin-bottom:8px}
.revwrap{flex:1;display:flex;gap:clamp(16px,2.2vw,40px);min-height:0;align-items:stretch}
.revleft{flex:1 1 56%;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.4vh,18px);min-width:0}
.revright{flex:1 1 44%;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,16px);min-width:0;justify-content:center}
.bq.rev{font-size:clamp(22px,2.3vw,40px);margin:0}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(5px,.7vh,10px)}
.alist li{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:clamp(8px,1vw,16px);align-items:center;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;overflow:hidden;padding:clamp(8px,1vw,16px) clamp(12px,1.3vw,22px);opacity:.45}
.alist li.right{opacity:1;border-color:var(--ok);border-width:3px;box-shadow:0 4px 16px rgba(46,139,87,.2)}
.alist.poll li{opacity:1}
.alist .abar{position:absolute;left:0;top:0;bottom:0;background:var(--qc);opacity:.18;width:0;z-index:0;animation:barw 1s cubic-bezier(.2,.8,.3,1) .2s forwards}
@keyframes barw{to{width:var(--w)}}
.alist .ai{width:clamp(26px,2.4vw,40px);height:clamp(26px,2.4vw,40px);border-radius:9px;background:var(--qc);display:flex;align-items:center;justify-content:center;z-index:1}
.alist .ai svg{width:70%;height:70%}
.alist .at{font-size:clamp(15px,1.4vw,25px);font-weight:700;line-height:1.16;z-index:1}
.alist .ac{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:clamp(15px,1.4vw,25px);z-index:1}
.alist li.right .at::after{content:" ✓";color:var(--ok)}
.qexpl{background:var(--card);border-left:5px solid var(--gold);border-radius:4px 14px 14px 4px;padding:clamp(12px,1.3vw,20px) clamp(15px,1.6vw,24px);
  font-size:clamp(16px,1.35vw,24px);line-height:1.4;color:var(--ink2)}
.qexpl b{color:var(--ink)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.2vw,18px)}
.dcard{border-radius:18px;padding:clamp(12px,1.4vw,24px);color:#fff;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.dcard.t0{background:linear-gradient(150deg,var(--herz),var(--herz2))} .dcard.t1{background:linear-gradient(150deg,var(--kopf),var(--kopf2))}
.dcard .dl{font-family:"JetBrains Mono",monospace;font-size:clamp(11px,.9vw,15px);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.dcard .dv{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(42px,4.6vw,86px);line-height:.9}
.dcard .dm{font-size:clamp(13px,1.05vw,18px);opacity:.9}
.dcard .dwin{position:absolute;right:12px;bottom:12px;background:var(--gold);color:#3A2E12;border-radius:99px;padding:2px 10px;font-weight:800;font-size:clamp(11px,.9vw,15px)}

/* Lobby */
.lobby{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.4vh,20px);min-height:0}
.ltop{display:flex;align-items:center;gap:clamp(18px,2.2vw,40px);flex-wrap:wrap}
.ltitle{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(30px,3.4vw,62px);line-height:.95;letter-spacing:-.03em}
.joinaddr{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:clamp(17px,1.7vw,30px);line-height:1.05;color:var(--ink2);word-break:break-all}
.roomcode{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.2em;font-size:clamp(34px,4.2vw,74px);line-height:1;color:var(--ink);
  display:inline-block;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:clamp(4px,.5vw,10px) clamp(12px,1.4vw,26px);box-shadow:6px 6px 0 var(--ink)}
.qrbox{background:#fff;padding:clamp(8px,.8vw,14px);border-radius:16px;border:1.5px solid var(--line);box-shadow:0 8px 26px rgba(18,22,24,.1);flex:none}
.qrbox canvas{display:block;width:clamp(100px,10.5vw,175px);height:auto;image-rendering:pixelated}
.startbtn{margin-left:auto;background:linear-gradient(90deg,var(--herz),var(--kopf));color:#fff;font-weight:800;padding:clamp(13px,1.3vw,19px) clamp(28px,3vw,50px);
  border-radius:99px;font-size:clamp(17px,1.5vw,25px);box-shadow:0 5px 0 #3B2A5E;flex:none}
.startbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #3B2A5E}
.startbtn:disabled{background:var(--ink3);box-shadow:0 5px 0 #4a5053;cursor:not-allowed}
.mgr{position:fixed;inset:0;z-index:95;background:rgba(14,17,19,.55);display:flex;align-items:center;justify-content:center;padding:4vh 3vw}
.mgrbox{background:var(--card);border-radius:18px;padding:clamp(18px,2vw,30px);width:min(680px,100%);max-height:92vh;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mgrlist{overflow:auto;display:flex;flex-direction:column;gap:7px;min-height:0}
.mgrrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px}
.mgrrow .mf{height:30px;aspect-ratio:120/220}
.mgrrow b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:700}
.mini.warn{border-color:var(--bad);color:var(--bad)} .mini.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Zwischenstand + Podium */
.scoreboard{display:flex;flex-direction:column;gap:clamp(6px,.8vh,12px);min-height:0;overflow:auto}
.srow{display:grid;grid-template-columns:clamp(40px,3.4vw,64px) auto 1fr auto;gap:clamp(10px,1.3vw,22px);align-items:center;background:var(--card);
  border:1.5px solid var(--line);border-left:6px solid var(--tc);border-radius:12px;padding:clamp(6px,.8vw,12px) clamp(13px,1.4vw,22px);animation:slidein .5s cubic-bezier(.2,.8,.3,1) both}
.srow.t0{--tc:var(--herz)} .srow.t1{--tc:var(--kopf)}
.srow .sr{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(22px,2.3vw,40px);color:var(--ink3);line-height:1}
.srow .sf{height:clamp(36px,3.4vw,60px);aspect-ratio:120/220}
.srow .sn{font-weight:700;font-size:clamp(16px,1.5vw,27px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ss{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:clamp(16px,1.5vw,27px);font-variant-numeric:tabular-nums}
.srow .sd{font-family:"JetBrains Mono",monospace;font-size:clamp(12px,1vw,17px);color:var(--ok);margin-left:8px}
.srow.top1{border-color:var(--gold);border-left-color:var(--tc);border-width:2px 2px 2px 6px}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.top3{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,2.4vw,52px);min-height:0;padding-top:clamp(8px,1.4vh,20px)}
.t3{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;max-width:clamp(140px,15vw,230px);flex:1;animation:rise .6s ease both}
.t3 .t3f{aspect-ratio:120/220;height:56%;max-height:56%}
.t3 .t3n{font-weight:800;font-size:clamp(15px,1.4vw,26px);text-align:center;line-height:1.14;margin-top:6px;overflow-wrap:anywhere}
.t3 .t3s{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ink2);font-size:clamp(13px,1.1vw,19px);margin:2px 0 8px}
.t3 .t3b{width:100%;border-radius:12px 12px 0 0;display:flex;justify-content:center;padding:clamp(5px,.6vw,10px) 0;position:relative;overflow:hidden}
.t3 .t3r{font-family:"Fraunces",serif;font-weight:800;color:#fff;line-height:1;font-size:clamp(20px,2.2vw,40px)}
.t3.g1 .t3b,.pod.g1 .pb{background:linear-gradient(180deg,#E3BE5E,#A8832E)}
.t3.g2 .t3b,.pod.g2 .pb{background:linear-gradient(180deg,#C3CACD,#8E969A)}
.t3.g3 .t3b,.pod.g3 .pb{background:linear-gradient(180deg,#D09A6A,#9D6A42)}
.pod.g4 .pb{background:linear-gradient(180deg,#B9B3A6,#8B8578)}
.t3.g1 .t3f{height:66%;max-height:66%}
.t3.g1 .t3b::after,.pod.g1 .pb::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);
  animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes grow{from{height:0}to{height:var(--h)}}
.final{flex:1;display:flex;flex-direction:column;min-height:0;gap:clamp(8px,1.2vh,16px)}
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.2vw,26px);min-height:0}
.pod{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;max-width:clamp(150px,16vw,250px);height:100%;position:relative}
.pod .pfw{aspect-ratio:120/220;opacity:0;animation:rise .55s ease both;position:relative}
.pod .pfw .glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200%;height:200%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,110,.55) 0%,rgba(255,214,110,0) 62%)}
.pod .pa{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:clamp(10px,.85vw,14px);color:#8B6914;
  text-align:center;margin-top:5px;opacity:0;animation:rise .5s ease both;line-height:1.2}
.pod .pn{font-weight:800;font-size:clamp(15px,1.5vw,27px);text-align:center;line-height:1.14;overflow-wrap:anywhere;opacity:0;animation:rise .5s ease both}
.pod .ps{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:clamp(13px,1.15vw,20px);color:var(--ink2);margin:3px 0 9px;opacity:0;animation:rise .5s ease both}
.pod .pb{width:100%;border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:clamp(8px,.9vw,15px);height:0;animation:grow .85s cubic-bezier(.2,.85,.3,1) both;position:relative;overflow:hidden}
.pod .pr{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(26px,3.3vw,60px);color:#fff;line-height:1}
.winbar{display:flex;align-items:center;gap:clamp(12px,1.4vw,24px);border-radius:18px;padding:clamp(10px,1.2vw,20px) clamp(14px,1.6vw,26px);color:#fff;flex:none;animation:rise .6s ease 3.6s both}
.winbar.t0{background:linear-gradient(90deg,var(--herz),var(--herz2))} .winbar.t1{background:linear-gradient(90deg,var(--kopf),var(--kopf2))}
.winbar.tie{background:linear-gradient(90deg,var(--herz),var(--kopf))}
.winbar .wi{font-size:clamp(34px,3.4vw,62px)}
.winbar .wt{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(22px,2.3vw,42px);line-height:1}
.winbar .ws{font-size:clamp(13px,1.1vw,19px);opacity:.92;margin-top:4px;font-style:italic;font-family:"Fraunces",serif}

.nextbtn{position:fixed;right:clamp(16px,1.8vw,30px);bottom:clamp(16px,1.8vh,30px);z-index:60;background:var(--ink);color:var(--paper);font-weight:800;
  border-radius:99px;padding:clamp(12px,1.2vw,18px) clamp(22px,2.2vw,36px);font-size:clamp(15px,1.3vw,22px);display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(18,22,24,.3)}
.nextbtn span{font-size:1.35em;line-height:1;opacity:.75}
.nextbtn:hover{background:linear-gradient(90deg,var(--herz),var(--kopf))}

/* Meldungen und Effekte */
#toasts{position:fixed;left:clamp(14px,1.6vw,28px);bottom:clamp(14px,1.6vh,26px);z-index:80;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(23,23,43,.92);color:#fff;border-radius:99px;padding:7px 16px;font-size:clamp(13px,1vw,17px);font-weight:700;display:flex;align-items:center;gap:8px;
  animation:tin .25s ease both, tout .4s ease 1.7s both}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#float{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.fl{position:absolute;bottom:-70px;font-size:clamp(28px,2.8vw,50px);text-align:center;animation:rise2 4.4s ease-out forwards}
.fl small{font-family:"JetBrains Mono",monospace;font-size:.3em;color:var(--ink2);display:block;margin-top:2px;font-weight:700}
.fl.pill{font-size:clamp(15px,1.3vw,23px);font-weight:800;background:var(--card);border:2.5px solid var(--ink);border-radius:99px;padding:8px 18px;white-space:nowrap;
  box-shadow:0 6px 20px rgba(18,22,24,.18);animation:rise3 4.6s ease-out forwards}
.fl.pill small{font-size:.66em;color:var(--ink3);border-top:1px solid var(--line);margin-top:3px;padding-top:2px}

function tone(f,st,du,vo,ty){
  var c=audio(); if(!c) return;
  var o=c.createOscillator(), g=c.createGain(); o.type=ty||"sine"; o.frequency.value=f;
  var t=c.currentTime+st; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vo,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+du);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+du+0.05);
}

var BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
var cli=null, bi=0, ROOM="", IS_HOST=false, onState=null, onMsg=null, connected=false, onReconnect=null;
function tS(){ return "herzkopf/"+ROOM+"/s"; }
function tM(){ return "herzkopf/"+ROOM+"/m"; }
var wantConnect=false, reconnTimer=null;
function netConnect(ready){
  if(typeof mqtt==="undefined"){ showBadge("Keine Internetverbindung"); return; }
  wantConnect=true;
  var tried=0, first=true;
  function go(){
    if(!wantConnect) return;
    if(cli){ try{ cli.end(true); }catch(e){} cli=null; }
    var c=mqtt.connect(BROKERS[bi],{clientId:"hk"+Math.random().toString(16).slice(2,10),clean:true,connectTimeout:6000,reconnectPeriod:0,keepalive:20});
    var settled=false;
    c.on("connect",function(){
      settled=true; connected=true; cli=c; tried=0; hideBadge();
      c.subscribe([tS(), tM()], {qos:0});
      if(first){ first=false; if(ready) ready(); } else if(IS_HOST && onReconnect) onReconnect();
    });
    c.on("message",function(topic,payload){
      var m=null; try{ m=JSON.parse(payload.toString()); }catch(e){ return; }
      if(!m) return;
      if(topic===tS() && onState) onState(m); else if(topic===tM() && onMsg) onMsg(m);
    });
    c.on("error",function(){ try{ c.end(true); }catch(e){} });
    c.on("close",function(){
      connected=false;
      if(!settled){ tried++; bi=(bi+1)%BROKERS.length;
        if(tried<BROKERS.length*3) retry(700); else { showBadge("Keine Verbindung — Internet prüfen"); retry(4000); } return; }
      showBadge("Verbindung kommt gleich zurück …"); retry(900);
    });
  }
  function retry(ms){ if(reconnTimer) clearTimeout(reconnTimer); reconnTimer=setTimeout(go, ms); }
  function kick(){ if(wantConnect && !connected){ if(reconnTimer) clearTimeout(reconnTimer); go(); } }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) kick(); });
  window.addEventListener("online", kick); window.addEventListener("pageshow", kick); window.addEventListener("focus", kick);
  go();
}
function pub(topic,obj,retain){ if(!cli||!connected) return; try{ cli.publish(topic, JSON.stringify(obj), {qos:0, retain:!!retain}); }catch(e){} }

function startHost(){
  var G={ phase:"lobby", qi:0, endsAt:0, players:{}, order:[], answers:{}, evts:[], ekey:0, banned:{}, out:{}, gone:{} };
  /* Versehentlich neu geladen? Spielstand kommt aus dem Browser-Speicher zurück —
     alle bleiben mit ihren Punkten drin. */
  try{ var saved=JSON.parse(store("hk-game-"+ROOM)||"null"); if(saved && saved.players) G=saved; G.evts=[]; }catch(e){}
  var lastKey="", seenAns={}, lastScores={}, bumped={}, danceUntil={}, topShown=-1;
  var jQueue=[], jBusy=false, dirty=true, mgrOpen=false, lastSec=-1;

  onMsg=handle; onState=null;
  onReconnect=function(){ dirty=true; publish(); };
  showBadge("Verbinde …");
  netConnect(function(){ hideBadge(); dirty=true; publish(); draw(true); });
  setInterval(tick, 300);
  setInterval(paintTimer, 110);

  document.addEventListener("keydown", function(e){
    if((e.target.tagName||"").toLowerCase()==="input") return;
    var k=e.key;
    if(k===" "||k==="ArrowRight"||k==="Enter"){ e.preventDefault(); advance(); }
    else if(k==="s"||k==="S"){ if(G.phase==="reveal"){ G.phase="scores"; advance(); } }
    else if(k==="f"||k==="F"){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }
    else if(k==="m"||k==="M"){ muted=!muted; store("hk-mute",muted?"1":"0"); if(!muted) sndBlip(); lastKey=""; draw(true); }
    else if(k==="d"||k==="D"){ G.order.forEach(function(id){ var d=danceOf((G.players[id]||{}).ac)||1; danceUntil[id]={t:Date.now()+5000,d:d}; }); applyDance(); }
    else if(k==="k"||k==="K"){ mgrOpen=!mgrOpen; renderMgr(); }
    else if(k==="r"||k==="R"){
      if(confirm("Quiz neu starten? Alle Spieler und Punkte werden gelöscht.")){
        G.players={}; G.order=[]; G.answers={}; G.phase="lobby"; G.qi=0; G.out={}; seenAns={}; lastScores={}; dirty=true; lastKey=""; publish(); draw(true);
      }
    }
    else if(k==="n"||k==="N"){
      if(confirm("Neuen Raum mit neuem Code öffnen?")){ try{ localStorage.removeItem("hk-host"); }catch(x){} location.hash=""; location.reload(); }
    }
  });

  function list(){ return G.order.map(function(id){ return G.players[id]; }).filter(Boolean); }
  function ranked(){ return list().slice().sort(function(a,b){ return b.s-a.s || String(a.n).localeCompare(String(b.n)); }); }
  function counts(qi){
    var c=[0,0,0,0], a=G.answers[qi===undefined?G.qi:qi]||{};
    Object.keys(a).forEach(function(id){ var v=a[id].a; if(v>=0&&v<4) c[v]++; });
    return c;
  }
  /* pro Team: wie viele haben geantwortet, wie viele richtig, Verteilung */
  function teamQ(){
    var q=QUIZ[G.qi], a=G.answers[G.qi]||{}, out=[{n:0,ans:0,ok:0,c:[0,0,0,0]},{n:0,ans:0,ok:0,c:[0,0,0,0]}];
    list().forEach(function(p){
      var t=out[p.tm===1?1:0]; t.n++;
      var r=a[p.id]; if(!r) return;
      t.ans++; t.c[r.a]++; if(q.t!=="poll" && r.a===q.r) t.ok++;
    });
    return out;
  }
  function stateObj(){
    var left=(G.phase==="question") ? Math.max(0, G.endsAt-Date.now()) : 0;
    var cs=(G.phase==="question") ? [0,0,0,0] : counts();
    var a=G.answers[G.qi]||{};
    return { ph:G.phase, qi:G.qi, left:left, an:Object.keys(a).length, cs:cs, out:G.out,
      ps:list().map(function(p){ return {id:p.id,n:p.n,ar:p.ar,ac:p.ac,tm:p.tm,s:p.s,last:p.last,nr:p.nr,bm:p.bm,em:p.em,jk:p.jk,stk:p.stk,bstk:p.bstk,bon:p.bon,jg:p.jg,jh:p.jh,keep:p.keep||null}; }),
      ev:G.evts.slice(-14), r:ROOM };
  }
  var lastSave=0;
  function publish(){
    pub(tS(), stateObj(), true); dirty=false;
    if(Date.now()-lastSave>1000){ lastSave=Date.now(); store("hk-game-"+ROOM, JSON.stringify(G)); }
  }

  var lastPub=0;
  function tick(){
    if(G.phase==="question"){
      var done=Object.keys(G.answers[G.qi]||{}).length;
      if(Date.now()>=G.endsAt || (G.order.length>0 && done>=G.order.length)){ score(); G.phase="reveal"; dirty=true; }
    }
    var now=Date.now();
    if(dirty || (G.phase==="question" && now-lastPub>450) || now-lastPub>2500){ publish(); lastPub=now; }
    draw(); paintRail(); applyDance();
  }
  function addEvt(t,e,n,ar,ac,tm,pid){
    G.ekey++; G.evts.push({k:G.ekey,t:t,e:e,n:n,ar:ar,ac:ac,tm:tm,pid:pid||""});
    while(G.evts.length>20) G.evts.shift();
    dirty=true;
  }
  var rateLog={};
  function rateOk(p){ var now=Date.now(), a=rateLog[p.id]||(rateLog[p.id]=[]); while(a.length && now-a[0]>5000) a.shift(); if(a.length>=12) return false; a.push(now); return true; }

  function handle(m){
    if(!m||!m.id) return;
    if(m.t==="join"){
      if(G.players[m.id]){ dirty=true; return; }
      var nm=String(m.n||"").trim().slice(0,16) || "Anonym";
      if(G.banned[nm.toLowerCase()]){ G.out[m.id]="ban"; dirty=true; return; }
      if(G.order.length>=MAXP){ G.out[m.id]="full"; dirty=true; return; }
      delete G.out[m.id];
      G.players[m.id]={id:m.id,n:nm,ar:clamp(parseInt(m.ar,10)||0,0,ARCH.length-1),tm:(m.tm===1?1:0),
        ac:String(m.ac||"0,0,0,0,0").replace(/[^0-9,]/g,"").slice(0,24),
        s:0,last:0,nr:0,bm:0,em:0,jk:0,stk:0,bstk:0,bon:0,jg:-1,jh:-1,keep:null};
      G.order.push(m.id);
      toast(TEAM[m.tm===1?1:0].i, nm+" ist dabei");
      dirty=true; return;
    }
    var p=G.players[m.id]; if(!p) return;
    if(m.t==="answer"){
      if(G.phase!=="question" || m.qi!==G.qi) return;
      if(!G.answers[G.qi]) G.answers[G.qi]={};
      if(G.answers[G.qi][m.id]) return;
      G.answers[G.qi][m.id]={a:clamp(parseInt(m.a,10)||0,0,nOpts(QUIZ[G.qi])-1), ms:Math.max(0,G.endsAt-Date.now())};
      if(!seenAns[m.id+":"+G.qi]){ seenAns[m.id+":"+G.qi]=1; sndBlip(); }
      dirty=true; return;
    }
    if(m.t==="joker"){
      var q=QUIZ[G.qi];
      if(G.phase!=="question" || m.qi!==G.qi || q.t==="poll") return;
      if(G.answers[G.qi] && G.answers[G.qi][m.id]) return;
      if(m.j==="gold" && p.jg<0){ p.jg=G.qi; p.jk++; addEvt("joker","gold",p.n,p.ar,p.ac,p.tm); }
      else if(m.j==="half" && p.jh<0 && q.t==="mc"){
        p.jh=G.qi; p.jk++;
        var right=q.r, wrong=[0,1,2,3].filter(function(x){return x!==right;});
        var keep2=wrong[Math.floor(Math.random()*wrong.length)];
        p.keep=[0,1,2,3].filter(function(x){ return x===right||x===keep2; });
        addEvt("joker","half",p.n,p.ar,p.ac,p.tm);
      }
      dirty=true; return;
    }
    if(m.t==="look"){
      var nn=String(m.n||"").trim().slice(0,16);
      if(nn && !G.banned[nn.toLowerCase()]) p.n=nn;
      p.ar=clamp(parseInt(m.ar,10)||0,0,ARCH.length-1);
      p.ac=String(m.ac||p.ac).replace(/[^0-9,]/g,"").slice(0,24);
      /* Team nur in der Lobby wechselbar — sonst könnte man zum führenden Team springen */
      if(G.phase==="lobby") p.tm=(m.tm===1?1:0);
      dirty=true; lastKey=""; return;
    }
    if(m.t==="emo"||m.t==="shout"||m.t==="dance"){
      if(!rateOk(p)) return;
      p.em++;
      if(m.t==="dance") danceUntil[p.id]={t:Date.now()+4000, d:clamp(parseInt(m.e,10)||1,1,5)};
      addEvt(m.t, String(m.e||"").slice(0,40), p.n, p.ar, p.ac, p.tm, p.id);
    }
  }

  function score(){
    var q=QUIZ[G.qi], a=G.answers[G.qi]||{}, S=secsOf(q)*1000;
    list().forEach(function(p){
      var add=0; p.bon=0; var rec=a[p.id];
      if(q.t==="poll"){
        add = rec ? 50 : 0;
      } else if(rec && rec.a===q.r){
        add=100+Math.round(60*clamp(rec.ms/S,0,1));
        p.stk++; if(p.stk>p.bstk) p.bstk=p.stk;
        p.bon=Math.min(60,(p.stk-1)*20); add+=p.bon;
        if(p.jg===G.qi) add*=2;
        if(q.fin) add*=2;
        p.nr++; if(rec.ms>p.bm) p.bm=rec.ms;
      } else { p.stk=0; }
      p.last=add; p.s+=add;
    });
  }
  function advance(){
    if(G.phase==="lobby"){
      if(!G.order.length) return;
      audio(); G.qi=0; G.phase="question"; G.endsAt=Date.now()+secsOf(QUIZ[0])*1000+1300;
      list().forEach(function(p){ p.keep=null; });
    }
    else if(G.phase==="question"){ score(); G.phase="reveal"; }
    else if(G.phase==="reveal"){ G.phase="scores"; }
    else if(G.phase==="scores"){
      if(G.qi<QUIZ.length-1){
        G.qi++; G.phase="question"; G.endsAt=Date.now()+secsOf(QUIZ[G.qi])*1000+1300;
        G.evts=[]; list().forEach(function(p){ p.keep=null; });
      } else G.phase="final";
    }
    else if(G.phase==="final"){ G.phase="photo"; }
    dirty=true; lastKey=""; publish(); draw(true);
  }

  function kick(id,ban){
    var p=G.players[id]; if(!p) return;
    if(ban) G.banned[p.n.toLowerCase()]=1;
    G.out[id]=ban?"ban":"kick"; G.gone[id]=p; delete G.players[id];
    G.order=G.order.filter(function(x){ return x!==id; });
    toast(ban?"⛔":"✕", p.n+(ban?" gesperrt":" entfernt"));
    dirty=true; lastKey=""; publish(); draw(true); renderMgr();
  }
  function readmit(id){
    var p=G.gone[id]; if(!p) return;
    if(G.order.length>=MAXP){ toast("!", "Quiz ist voll"); return; }
    delete G.banned[p.n.toLowerCase()]; delete G.out[id]; delete G.gone[id];
    G.players[id]=p; if(G.order.indexOf(id)<0) G.order.push(id);
    toast("✔", p.n+" ist wieder dabei");
    dirty=true; lastKey=""; publish(); draw(true); renderMgr();
  }

      var id=w.getAttribute("data-fig"), f=w.querySelector(".fig"); if(!f) return;
      var e=danceUntil[id], act=e && e.t>Date.now(), p=G.players[id];

  function paintTimer(){

  var lastPhase="";
  function draw(force){
    if(G.phase!==lastPhase){
      if(lastPhase && G.phase==="reveal") sndReveal();
      if(lastPhase && G.phase==="final"){ sndFanfare(); confetti(110); }
      if(lastPhase && G.phase==="photo"){ confetti(60); }
      lastPhase=G.phase; lastSec=-1;
    }
    playEvents();
    var key=G.phase+":"+G.qi+":"+G.order.length+":"+muted+":"+(G.phase==="lobby"?list().map(function(p){return p.n+p.ar+p.ac+p.tm;}).join("|"):"");
    if(!force && key===lastKey) return;
    lastKey=key;
    if(G.phase==="lobby")    return lobby();
    if(G.phase==="question") return question();
    if(G.phase==="reveal")   return reveal();
    if(G.phase==="scores")   return scores();
    if(G.phase==="final")    return final();

  }

function funTitles(rs){
  var out={}, taken={};
  function give(p,t){ if(p&&!out[p.id]&&!taken[t]){ out[p.id]=t; taken[t]=1; } }
  function best(f){ var b=null; rs.forEach(function(p){ if(f(p)>0 && (!b||f(p)>f(b))) b=p; }); return b; }
  give(best(function(p){return p.bm||0;}),"Schnellstes Gewissen");
  give(best(function(p){return p.nr||0;}),"Tugend-Profi");
  give(best(function(p){return p.em||0;}),"Stimmungskanone der Akademie");
  give(best(function(p){return p.bstk||0;}),"Längste Serie");
  var g=null; rs.forEach(function(p){ if((p.jk||0)>=2 && !g) g=p; }); give(g,"Setzt alles auf Gold");
  var z=null; rs.forEach(function(p){ if(!(p.nr||0) && !z) z=p; }); give(z,"Weiß, dass er/sie nichts weiß");
  var k=0; rs.forEach(function(p){ if(!out[p.id]){ out[p.id]=FILLTITLES[k%FILLTITLES.length]; k++; } });
  return out;
}

    var q=QUIZ[S.qi], n=myAns[S.qi], r=row()||{jg:-1}, gold=(r.jg===S.qi), L=ansLabel(q,n);
    h('<div class="wrap">'+bar()+'<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center">'+
      '<div class="tline"><span class="tnum" id="tn">0</span><span class="ttrack"><i id="tb" style="width:0"></i></span></div>'+
      '<div class="ans" style="--ac:'+L.c+';pointer-events:none;min-height:150px"><span style="font-size:44px">'+L.i+'</span><span class="lt" style="font-size:19px">'+esc(L.t)+'</span></div>'+
      '<h2 class="serif" style="font-size:26px">Antwort abgegeben.</h2>'+(gold?'<p class="goldnote">Doppelte Punkte laufen</p>':"")+
      '<p class="p">'+(q.t==="poll"?"Hier gibt es kein Richtig oder Falsch.":"Je schneller du warst, desto mehr Punkte.")+'</p></div></div>');
    paintTimer();
  }
  function result(){
    var q=QUIZ[S.qi], mine=myAns[S.qi], r=row()||{last:0,s:0,jg:-1,stk:0,bon:0}, rk=myRank(), cls, title, gold=(r.jg===S.qi);
    if(q.t==="poll"){ cls=mine===undefined?"miss":"poll"; title=mine===undefined?"Nicht abgestimmt":"Danke fürs Nachdenken!"; }
    else { var right=mine===q.r; cls=mine===undefined?"miss":(right?(gold?"gold2":"good"):"bad");
      title=mine===undefined?"Zu langsam":(right?(gold?"Richtig — doppelt!":"Richtig!"):"Leider falsch"); }
    var R = q.t==="poll" ? null : ansLabel(q,q.r);
    h('<div class="wrap">'+bar()+'<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px">'+
      '<div class="verdict '+cls+'"><div class="vt">'+title+'</div><div class="vp">+'+(r.last||0)+' Punkte'+(q.fin&&r.last?" (Finale ×2)":"")+'</div></div>'+
      ((r.stk||0)>=2 ? '<div style="text-align:center"><span class="seriebig">🔥 '+r.stk+' richtige in Folge'+((r.bon||0)>0?' · +'+r.bon+' Bonus':'')+'</span></div>' : '')+
      (R ? '<div class="card" style="text-align:center"><span class="eyebrow" style="font-size:12px">Richtig war</span>'+
        '<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px">'+
        '<span style="width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;background:'+R.c+';border-radius:9px;color:#fff;font-size:20px;padding:6px">'+R.i+'</span>'+
        '<b style="font-size:18px">'+esc(R.t)+'</b></div></div>' : '')+
      '<div class="card gold"><p class="p" style="font-size:15.5px">'+q.e+'</p></div>'+
      '<p class="p" style="text-align:center">Platz <b style="color:var(--ink)">'+rk.r+'</b> von '+rk.of+'</p></div>'+reactBar()+'</div>');
    wireReact();
    if(navigator.vibrate && q.t!=="poll" && mine===q.r) try{ navigator.vibrate([40,60,40]); }catch(e){}
  }
  function standing(){
    var r=row()||{s:0,tm:0}, rk=myRank(), ts=teamStats(players());
    h('<div class="wrap">'+bar()+'<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center">'+
      '<span class="eyebrow">Dein Zwischenstand</span>'+
      '<div class="serif" style="font-size:62px;line-height:.9;background:linear-gradient(90deg,var(--herz),var(--kopf));-webkit-background-clip:text;background-clip:text;color:transparent">'+(r.s||0)+'</div>'+
      '<h2 style="font-size:20px;font-weight:800">Platz '+rk.r+' von '+rk.of+'</h2>'+
      '<div class="card" style="padding:12px 14px">'+tugHTML(ts)+'</div>'+
      '<div class="minihall">'+hallHTML(ranked().map(function(p){ return {id:p.id,n:p.n,ar:p.ar,ac:p.ac,tm:p.tm}; }),{noNames:true})+'</div>'+
      '</div>'+reactBar()+'</div>');
    wireReact(); applyDanceP();
  }
  function ended(){
    var r=row()||{s:0,ar:0,ac:"",tm:0}, rk=myRank(), t=funTitles(ranked()), ts=teamStats(players());
    var amt=(rk.r>=1&&rk.r<=4)?OFFICES[rk.r-1]:null;
    var w = Math.abs(ts[0].avg-ts[1].avg)<1 ? -1 : (ts[0].avg>ts[1].avg?0:1);
    h('<div class="wrap">'+bar()+'<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center">'+
      '<span style="height:140px;aspect-ratio:120/220;display:block" data-me="1">'+figSVG(r.ar,r.ac,r.tm,"cheer")+'</span>'+
      '<span class="eyebrow">Endstand · Platz '+rk.r+' von '+rk.of+'</span>'+
      (amt ? '<h1 class="serif" style="font-size:29px;line-height:1.04">Du bist '+esc(amt[0])+'.</h1><p class="p" style="font-size:15px">'+esc(amt[1])+'</p>'
           : '<h1 class="serif" style="font-size:29px">'+esc(t[MYID]||"Philosoph:in")+'</h1>')+
      '<div class="serif" style="font-size:56px;line-height:.9;color:var(--ink);margin-top:4px">'+(r.s||0)+'</div>'+
      (amt ? '<p class="p" style="font-size:14.5px">'+esc(t[MYID]||"")+'</p>' : "")+
      '<div class="tbadge '+(w<0?"":"t"+w)+'" style="font-size:15px;padding:6px 14px;'+(w<0?"background:linear-gradient(90deg,var(--herz),var(--kopf))":"")+'">'+
        (w<0?"Unentschieden zwischen Herz und Kopf":(w===r.tm?"🏆 Dein Team hat gewonnen!":TEAM[w].n+" hat gewonnen"))+'</div>'+
      '</div>'+reactBar()+'</div>');
    wireReact();
  }
  var seenDance={};
  function applyDanceP(){
    arr(S&&S.ev).forEach(function(r){
      if(!r||r.t!=="dance"||seenDance[r.k]) return; seenDance[r.k]=1;
      var ps=players();
      for(var i=0;i<ps.length;i++){
        if(ps[i].n===r.n){
          var w=document.querySelector('.minihall .figw[data-fig="'+ps[i].id+'"] .fig');
          if(w){ clearDance(w); w.classList.add("dn"+(parseInt(r.e,10)||1)); (function(x){ setTimeout(function(){ clearDance(x); },4000); })(w); }
        }
      }
    });
  }
  setInterval(function(){ if(S && S.ph==="scores") applyDanceP(); }, 800);
}

boot();
})();
</script>
</body>
</html>
